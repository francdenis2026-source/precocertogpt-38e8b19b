    <link rel="icon" href="/favicon.png?v=6" type="image/png" sizes="512x512" />
    <link rel="shortcut icon" href="/favicon.ico?v=6" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=6" sizes="1024x1024" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="PreçoCerto" />
    <meta property="og:title" content="PreçoCerto | Marketplace Local" />
    <meta property="og:description" content="Compare, escolha e compre perto de você. Descubra preços, estabelecimentos e vendas online no comércio local." />
    <meta property="og:image" content="https://precocertogpt.lovable.app/social/preco-certo.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PreçoCerto | Marketplace Local" />
    <meta name="twitter:description" content="Compare, escolha e compre perto de você." />
    <meta name="twitter:image" content="https://precocertogpt.lovable.app/social/preco-certo.png" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      document.addEventListener("pointerdown", function (event) {
        var target = event.target;
        if (!(target instanceof Element)) return;
        if (!target.closest(".pc-stable-search__header > button")) return;

        var input = document.querySelector("#pc-home-search");
        if (input instanceof HTMLInputElement) {
          var setter = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, "value");
          if (setter && setter.set) setter.set.call(input, "");
          input.dispatchEvent(new Event("input", { bubbles: true }));
          input.dispatchEvent(new KeyboardEvent("keydown", {
            key: "Escape",
            code: "Escape",
            bubbles: true,
            cancelable: true
          }));
          input.blur();
        }

        document.body.classList.remove("pc-search-input-active");

        requestAnimationFrame(function () {
          var nextInput = document.querySelector("#pc-home-search");
          if (nextInput instanceof HTMLInputElement) {
            var nextSetter = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, "value");
            if (nextSetter && nextSetter.set) nextSetter.set.call(nextInput, "");
            nextInput.dispatchEvent(new Event("input", { bubbles: true }));
            nextInput.blur();
          }
          document.body.classList.remove("pc-search-input-active");
        });
      }, true);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
